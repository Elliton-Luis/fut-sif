<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Romário — caricatura arcade com barba cheia e sorriso aberto</title>
  <defs>
    <linearGradient id="skin" x1=".2" y1=".15" x2=".85" y2=".92">
      <stop stop-color="#f5cbb0"/>
      <stop offset=".52" stop-color="#dfa07f"/>
      <stop offset="1" stop-color="#b47158"/>
    </linearGradient>
    <linearGradient id="hair" x1=".3" y1=".05" x2=".75" y2=".95">
      <stop stop-color="#3b373e"/>
      <stop offset=".5" stop-color="#221e25"/>
      <stop offset="1" stop-color="#121015"/>
    </linearGradient>
    <linearGradient id="beard" x1=".2" y1=".2" x2=".8" y2=".98">
      <stop stop-color="#2d2931"/>
      <stop offset=".45" stop-color="#18151c"/>
      <stop offset="1" stop-color="#0a090c"/>
    </linearGradient>
    <linearGradient id="shirt" x1=".2" y1="0" x2=".8" y2="1">
      <stop stop-color="#25272e"/>
      <stop offset=".55" stop-color="#15171c"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
  </defs>

  <!-- Camiseta preta (gola redonda) -->
  <path fill="url(#shirt)" stroke="#0e0f14" stroke-width="2.6" stroke-linejoin="round"
        d="M26 128c3-12 16-17 38-17s35 5 38 17z"/>

  <!-- Orelhas (esquerda e direita) com contorno arcade -->
  <g stroke="#261f28" stroke-width="3.2" stroke-linejoin="round">
    <path fill="#cf9176" d="M28 62c-7-5-14-1-14 8 0 10 6 18 14 18l6-7z"/>
    <path fill="#cf9176" d="M100 62c7-5 14-1 14 8 0 10-6 18-14 18l-6-7z"/>
  </g>

  <!-- Dobras internas das orelhas -->
  <g fill="none" stroke="#935b4b" stroke-width="1.8" stroke-linecap="round">
    <path d="M22 69c3-2 6 1 6 5l-1 4"/>
    <path d="M106 69c-3-2-6 1-6 5l1 4"/>
  </g>

  <!-- Cabeça e Rosto base -->
  <path fill="url(#skin)" stroke="#261f28" stroke-width="3.4" stroke-linejoin="round"
        d="M32 38c8-18 24-25 43-25 19 0 35 7 43 25 7 15 6 33 2 48-4 15-13 26-25 31-13 5-27 5-40 0-12-5-21-16-25-31-4-15-5-33 2-48z"/>

  <!-- Cabelo curto degradê raspado nas laterais e entradas naturais -->
  <!-- Base escura do cabelo -->
  <path fill="url(#hair)" stroke="#221d26" stroke-width="3.2" stroke-linejoin="round"
        d="M26 62c-2-12 1-24 7-32 5-7 12-11 19-12 4-5 12-8 20-8 8 0 16 3 20 8 7 1 14 5 19 12 6 8 9 20 7 32-2 4-5 2-6-3-2-9-7-18-14-22-4-2-9-2-13 2-4 3-8 3-12 0-4-4-9-4-13-2-7 4-12 13-14 22-1 5-4 7-6 3z"/>

  <!-- Textura sutil do cabelo e degradê -->
  <g fill="none" stroke-linecap="round">
    <path stroke="#534d58" stroke-width="1.8" d="M38 31c6-10 16-15 26-16m12 0c10 1 20 6 26 16"/>
    <path stroke="#403a45" stroke-width="1.5" d="M48 22c6-3 11-4 16-4s10 1 16 4m-46 19c3-8 7-14 13-18m38 0c6 4 10 10 13 18"/>
  </g>

  <!-- Luz e volume na testa e bochechas -->
  <path fill="#ffdfca" opacity=".52"
        d="M44 38c6-5 14-7 20-7s14 2 20 7c-6 4-13 6-20 6s-14-2-20-6z"/>
  <ellipse cx="43" cy="73" rx="9" ry="6" fill="#f7b79a" opacity=".4"/>
  <ellipse cx="85" cy="73" rx="9" ry="6" fill="#f7b79a" opacity=".4"/>

  <!-- Sobrancelhas marcantes e expressivas -->
  <g fill="#241e26" stroke="#241e26" stroke-width="1.2" stroke-linejoin="round">
    <path d="M35 55c7-5 18-5 26-1l1 5c-9-3-18-3-26 1z"/>
    <path d="M67 59c8-4 19-4 26 1l-1 5c-8-4-17-4-26 1z"/>
  </g>

  <!-- Olhos expressivos e calorosos -->
  <!-- Fundo dos olhos -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path fill="#fff4e8" stroke="#684439" stroke-width="1.6"
          d="M37 66c6-6 16-6 23 0-6 5-16 5-23 0z"/>
    <path fill="#fff4e8" stroke="#684439" stroke-width="1.6"
          d="M68 66c6-6 16-6 23 0-6 5-16 5-23 0z"/>
  </g>

  <!-- Íris castanho-escuro e pupila -->
  <g fill="#2c2024">
    <circle cx="48.5" cy="65.5" r="4.2"/>
    <circle cx="79.5" cy="65.5" r="4.2"/>
  </g>
  <g fill="#150f12">
    <circle cx="48.5" cy="65.5" r="2.2"/>
    <circle cx="79.5" cy="65.5" r="2.2"/>
  </g>

  <!-- Brilho no olhar (specular highlight) -->
  <g fill="#ffffff">
    <circle cx="47.2" cy="64.2" r="1.2"/>
    <circle cx="78.2" cy="64.2" r="1.2"/>
    <circle cx="50" cy="66.5" r=".6"/>
    <circle cx="81" cy="66.5" r=".6"/>
  </g>

  <!-- Pálpebras e marcas de expressão ao redor dos olhos -->
  <g fill="none" stroke="#995f50" stroke-width="1.4" stroke-linecap="round">
    <path d="M39 61c5-3 13-3 19 0m12 0c5-3 13-3 19 0"/>
    <path d="M40 70c5 2 11 2 16 0m16 0c5 2 11 2 16 0"/>
  </g>

  <!-- Nariz largo e bem delineado -->
  <path fill="#d69274" d="M64 61c-2 6-4 12-7 16-2 3 0 7 4 8 4 1 10 1 14 0 4-1 6-5 4-8-3-4-5-10-7-16-1-3-3-3-4 0z"/>
  <ellipse cx="64" cy="80" rx="6.5" ry="4" fill="#e8ad91"/>
  <path fill="none" stroke="#8c4e40" stroke-width="1.7" stroke-linecap="round"
        d="M58 83c2-2 4-2 6 0m4 0c2-2 4-2 6 0"/>
  <ellipse cx="64" cy="79" rx="2.5" ry="1.5" fill="#ffd5be" opacity=".7"/>

  <!-- Linhas do sorriso (bigode chinês) -->
  <path fill="none" stroke="#945749" stroke-width="1.6" stroke-linecap="round"
        d="M50 78c-3 5-4 11-2 16m30-16c3 5 4 11 2 16"/>

  <!-- BARBA CHEIA E VOLUMOSA (desenho icônico cobrindo queixo, mandíbula e bochechas) -->
  <!-- Massa principal da barba com contorno cartoon -->
  <path fill="url(#beard)" stroke="#1a161e" stroke-width="3" stroke-linejoin="round"
        d="M26 67c3 13 8 23 15 30 2 2 4 4 7 5 3-5 7-8 16-8s13 3 16 8c3-1 5-3 7-5 7-7 12-17 15-30 2-4-2-7-5-5-4 4-8 9-11 15-3 4-8 6-13 6-4 0-7-2-10-4-3 2-6 4-10 4-5 0-10-2-13-6-3-6-7-11-11-15-3-2-7 1-5 5z"/>

  <!-- Extensão inferior da barba (queixo cheio e denso) -->
  <path fill="url(#beard)" stroke="#1a161e" stroke-width="3.2" stroke-linejoin="round"
        d="M37 94c3 10 8 18 15 24 7 5 16 7 24 5 9-2 15-8 20-16 4-6 6-12 8-18-4 7-9 13-16 17-7 4-16 4-24 1-9-3-15-9-19-17-3 1-5 2-8 4z"/>

  <!-- Bigode espesso contornando o lábio superior e descendo até a barba -->
  <path fill="url(#beard)" stroke="#1a161e" stroke-width="2.6" stroke-linejoin="round"
        d="M48 87c5-3 10-4 16-2 6-2 11-1 16 2 3 2 5 6 6 9-3-2-7-4-11-4-4 0-8 2-11 4-3-2-7-4-11-4-4 0-8 2-11 4 1-3 3-7 6-9z"/>

  <!-- BOCA: Sorriso aberto, largo e contagiante -->
  <!-- Fundo escuro da boca aberta -->
  <path fill="#3a181c" stroke="#251013" stroke-width="1.8" stroke-linejoin="round"
        d="M47 91c7-2 11-3 17-3s10 1 17 3c2 4 1 8-2 11-4 4-9 6-15 6s-11-2-15-6c-3-3-4-7-2-11z"/>

  <!-- Dentes superiores alinhados, brancos e reluzentes -->
  <path fill="#ffffff" stroke="#e0d6cb" stroke-width="1.2" stroke-linejoin="round"
        d="M49 91c6-1 10-2 15-2s9 1 15 2c1 3 0 5-2 6-4 1-8 2-13 2s-9-1-13-2c-2-1-3-3-2-6z"/>

  <!-- Divisões suaves dos dentes brancos -->
  <g stroke="#dfd4c8" stroke-width="1" stroke-linecap="round">
    <path d="M64 89v8"/>
    <path d="M59.5 89.5v7"/>
    <path d="M68.5 89.5v7"/>
    <path d="M55.5 90.5v5"/>
    <path d="M72.5 90.5v5"/>
  </g>

  <!-- Lábio inferior visível com brilho -->
  <path fill="#cf7a6e" d="M54 104c3 2 6 3 10 3s7-1 10-3c-3 1-6 2-10 2s-7-1-10-2z"/>

  <!-- Detalhes e mechas na barba (efeito arcade / fios e textura) -->
  <g fill="none" stroke-linecap="round">
    <path stroke="#423c4a" stroke-width="1.5"
          d="M33 76c3 8 7 15 13 21m36-21c-3 8-7 15-13 21"/>
    <path stroke="#36313d" stroke-width="1.4"
          d="M42 101c4 8 9 14 15 18m22-18c-4 8-9 14-15 18"/>
    <path stroke="#484252" stroke-width="1.2"
          d="M56 116c4 3 8 4 12 3m-8-24c3 1 6 1 9 0"/>
    <path stroke="#2a2530" stroke-width="1.6"
          d="M50 87c4-1 9-2 14-2s10 1 14 2"/>
  </g>
</svg>